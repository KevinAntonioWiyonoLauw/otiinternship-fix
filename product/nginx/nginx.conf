# filepath: e:\PROJECT\otiinternship-fix\product\nginx\nginx.conf

# Definisikan upstream server (api-gateway Anda)
upstream api_gateway_upstream {
    # Gunakan nama service dari docker-compose.yml dan port internalnya
    server api-gateway:6969;
}

server {
    listen 80; # Nginx akan mendengarkan di port 80 di dalam container
    server_name api.kevinio.my.id; 

    # logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        proxy_pass http://api_gateway_upstream; # Teruskan request ke upstream

        # Set header agar service backend mendapatkan informasi yang benar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}