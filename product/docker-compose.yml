services:


  # AUTH SERVICE DATABASE
  auth-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=auth_service_db
    volumes:
      - ./backend/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/auth-service/logs:/var/log/postgresql
      - auth-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AUTH SERVICE API
  auth-service-api:
    build: ./backend/auth-service
    environment:
      - PORT=${AUTH_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-service-db:5432/auth_service_db?sslmode=disable
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
      - TRAINING_SERVICE_URL=${TRAINING_SERVICE_URL}
      - PASSWORD_SALT_ROUNDS=10
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
    volumes:
      - ./backend/auth-service/logs:/home/appuser/app/logs
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"

  # EMAIL SERVICE DATABASE
  email-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=email_service_db
    volumes:
      - ./backend/email-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/email-service/logs:/var/log/postgresql
      - email-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d email_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # EMAIL SERVICE API
  email-service-api:
    build: ./backend/email-service
    environment:
      - PORT=${EMAIL_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@email-service-db:5432/email_service_db?sslmode=disable
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./backend/email-service/logs:/home/appuser/app/logs
    depends_on:
      email-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${EMAIL_SERVICE_PORT}:${EMAIL_SERVICE_PORT}"

  # MEETING SERVICE DATABASE
  meeting-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=meeting_service_db
    volumes:
      - ./backend/meeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/meeting-service/logs:/var/log/postgresql
      - meeting-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d meeting_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MEETING SERVICE API
  meeting-service-api:
    build: ./backend/meeting-service
    environment:
      - PORT=${MEETING_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - SERVICE_AUTH_KEY=meeting-service-secret-key
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@meeting-service-db:5432/meeting_service_db?sslmode=disable&TimeZone=Asia/Jakarta
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend/meeting-service/logs:/home/appuser/app/logs
    depends_on:
      meeting-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${MEETING_SERVICE_PORT}:${MEETING_SERVICE_PORT}"

  # TRAINING SERVICE DATABASE
  training-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=training_service_db
    volumes:
      - ./backend/training-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/training-service/logs:/var/log/postgresql
      - training-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d training_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TRAINING SERVICE API
  training-service-api:
    build: ./backend/training-service
    environment:
      - PORT=${TRAINING_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY_TRAINING}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@training-service-db:5432/training_service_db?sslmode=disable&TimeZone=Asia/Jakarta
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
      - MEETING_SERVICE_URL=${MEETING_SERVICE_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./backend/training-service/logs:/home/appuser/app/logs
    depends_on:
      training-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${TRAINING_SERVICE_PORT}:${TRAINING_SERVICE_PORT}"

  # ASPIRASI SERVICE DATABASE
  aspirasi-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=aspirasi_service_db
    volumes:
      - ./backend/aspirasi-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/aspirasi-service/logs:/var/log/postgresql
