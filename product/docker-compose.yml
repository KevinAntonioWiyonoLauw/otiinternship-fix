    networks:
      - oti-network
    ports:
      - "${PROGRESS_SERVICE_PORT}:${PROGRESS_SERVICE_PORT}"
      
  # Redis cache service
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

      
  api-gateway:
      build: ./api-gateway
      ports:
        - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
      env_file:
        - .env
        - ./api-gateway/.env
      volumes:
      - ./api-gateway/logs:/usr/srgit/app/logs
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - oti-network
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:${API_GATEWAY_PORT}/health/light"]
        interval: 30s
        timeout: 10s
        retries: 3

networks:
  oti-network:
    driver: bridge

volumes:
  auth-data:
  email-data:
  meeting-data:
  training-data:
  aspirasi-data:
  presence-data:
  progress-data:
  redis-data: