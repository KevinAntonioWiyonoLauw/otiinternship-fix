    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d aspirasi_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASPIRASI SERVICE API
  aspirasi-service-api:
    build: ./backend/aspirasi-service
    environment:
      - PORT=${ASPIRASI_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@aspirasi-service-db:5432/aspirasi_service_db?sslmode=disable
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
    volumes:
      - ./backend/aspirasi-service/logs:/home/appuser/app/logs
    depends_on:
      aspirasi-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${ASPIRASI_SERVICE_PORT}:${ASPIRASI_SERVICE_PORT}"

  # PRESENCE SERVICE DATABASE
  presence-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=presence_service_db
    volumes:
      - ./backend/presence-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/presence-service/logs:/var/log/postgresql
      - presence-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d presence_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PRESENCE SERVICE API
  presence-service-api:
    build: ./backend/presence-service
    environment:
      - PORT=${PRESENCE_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - QR_SECRET=${QR_SECRET}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@presence-service-db:5432/presence_service_db?sslmode=disable
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - TRAINING_SERVICE_URL=${TRAINING_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
    volumes:
      - ./backend/presence-service/logs:/home/appuser/app/logs
    depends_on:
      presence-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${PRESENCE_SERVICE_PORT}:${PRESENCE_SERVICE_PORT}"

  # PROGRESS SERVICE DATABASE
  progress-service-db:
    image: postgres:17.4-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=progress_service_db
    volumes:
      - ./backend/progress-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/progress-service/logs:/var/log/postgresql
      - progress-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d progress_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PROGRESS SERVICE API
  progress-service-api:
    build: ./backend/progress-service
    environment:
      - PORT=${PROGRESS_SERVICE_PORT}
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@progress-service-db:5432/progress_service_db?sslmode=disable
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
      - PRESENCE_SERVICE_URL=${PRESENCE_SERVICE_URL}
      - TRAINING_SERVICE_URL=${TRAINING_SERVICE_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_PATH=${LOG_PATH}
      - SERVICE_AUTH_KEY=${SERVICE_AUTH_KEY_PROGRESS}
    volumes:
      - ./backend/progress-service/logs:/home/appuser/app/logs
    depends_on:
      progress-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${PROGRESS_SERVICE_PORT}:${PROGRESS_SERVICE_PORT}"
      
  # Redis cache service
  redis:
    container_name: redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

      
  api-gateway:
      build: ./api-gateway
      environment:
        - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
        - EMAIL_SERVICE_URL=${EMAIL_SERVICE_URL}
        - MEETING_SERVICE_URL=${MEETING_SERVICE_URL}
        - TRAINING_SERVICE_URL=${TRAINING_SERVICE_URL}
        - ASPIRASI_SERVICE_URL=${ASPIRASI_SERVICE_URL}
        - PRESENCE_SERVICE_URL=${PRESENCE_SERVICE_URL}
        - PROGRESS_SERVICE_URL=${PROGRESS_SERVICE_URL}
        - JWT_SECRET=${JWT_SECRET}
        - REDIS_URL=${REDIS_URL}
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - PORT=${API_GATEWAY_PORT}
        - NODE_ENV=${NODE_ENV}
        - CORS_WHITELIST=${CORS_WHITELIST}
        - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS}
        - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
        - FRONTEND_URL=${FRONTEND_URL}
      ports:
        - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
      volumes:
        - ./api-gateway/logs:/usr/src/app/logs
      depends_on:
        redis:
          condition: service_healthy
      networks:
        - oti-network
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://localhost:${API_GATEWAY_PORT}/health/light"]
        interval: 30s
        timeout: 10s
        retries: 3

networks:
  oti-network:
    driver: bridge

volumes:
  auth-data:
  email-data:
  meeting-data:
  training-data:
  aspirasi-data:
  presence-data:
  progress-data:
  redis-data: