services:


  # AUTH SERVICE DATABASE
  auth-service-db:
    image: postgres:17.4-alpine
    env_file: 
      - ./backend/auth-service/.env
    volumes:
      - ./backend/auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/auth-service/logs:/var/log/postgresql
      - auth-data:/var/lib/postgresql/data
    networks:
      - oti-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # AUTH SERVICE API
  auth-service-api:
    build: ./backend/auth-service
    env_file:
      - ./backend/auth-service/.env
      - .env
    volumes:
      - ./backend/auth-service/logs:/home/appuser/app/logs
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - oti-network
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"

